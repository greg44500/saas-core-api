name: Publish Core RC2

on:
  push:
    branches:
      - ops/publish-1.0.0-rc.2
    paths:
      - .github/workflows/publish-rc2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.0-rc.2
      VERSION: 1.0.0-rc.2
      TARGET_SHA: 5c61c7066eeb56460adb164ba39ae0a0462bef53
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          if [ "$ACTUAL_MAIN" != "$TARGET_SHA" ]; then
            echo "Expected main $TARGET_SHA but found $ACTUAL_MAIN"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('core-release.json', 'utf8'));
          if (release.version !== process.env.VERSION || release.channel !== 'rc') {
            throw new Error(`Unexpected Core release identity: ${release.version} / ${release.channel}`);
          }
          NODE

      - name: Create immutable annotated tag if absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving it unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "Core $VERSION"
            git push origin "$TAG"
          fi

      - name: Create GitHub pre-release if absent
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Core 1.0.0-rc.2

          Deuxième Release Candidate du Core dans le cadre de D-017 — validation réelle de la dérivation et de l’upgrade d’un SaaS pilote.

          ### Provenance
          - version : `1.0.0-rc.2`
          - tag : `v1.0.0-rc.2`
          - commit source : `5c61c7066eeb56460adb164ba39ae0a0462bef53`
          - Core Gate post-merge : `#34`
          - run : `35239618709`
          - résultat : `success`

          ### Évolution observable depuis rc.1
          Le registre de routes frontend refuse désormais deux `path` strictement identiques dans une même surface de routing (`publicRoutes`, `authenticatedRoutes`, `workspaceRoutes` ou `platformRoutes`). Un même chemin reste autorisé sur deux surfaces différentes.

          Cette évolution durcit le point d’extension frontend sans introduire de dépendance au module métier `catalog`.

          ### Migrations, configuration et dépendances
          - aucune nouvelle migration Core ;
          - aucune nouvelle variable d’environnement ;
          - aucune dépendance ajoutée, supprimée ou mise à niveau par cette RC ;
          - aucun changement de contrat DB.

          ### Upgrade d’un SaaS dérivé
          L’intégration doit être réalisée sur une branche dédiée `core-update/1.0.0-rc.2` :
          1. récupérer l’upstream Core et ses tags ;
          2. intégrer `v1.0.0-rc.2` ;
          3. examiner les conflits Git réels ;
          4. vérifier migrations, configuration et dépendances ;
          5. exécuter les tests Core et métier, le build frontend et les E2E pertinents ;
          6. mettre à jour `core-origin.json` uniquement après validation complète.

          ### Rollback / reprise
          En cas d’échec de l’upgrade du produit dérivé, conserver sa provenance actuelle sur `v1.0.0-rc.1` et corriger sur une nouvelle branche. Le tag `v1.0.0-rc.2` ne doit jamais être déplacé ou réécrit.

          ### Statut D-017
          Cette RC fournit l’évolution Core post-dérivation nécessaire à l’exercice d’upgrade réel. Le tag stable `v1.0.0` reste interdit tant que D-017 n’est pas entièrement validée.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Core 1.0.0-rc.2" \
            --notes-file /tmp/release-notes.md \
            --prerelease

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
            echo "Tag $TAG resolves to $TAG_SHA instead of $TARGET_SHA"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,name,url
