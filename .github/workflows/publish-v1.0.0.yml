name: Publish Core 1.0.0

on:
  push:
    branches:
      - release/1.0.0

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: dfdd39a57c7fb1ec7e53ab7778a806fdc86f1dff
      TAG_NAME: v1.0.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validated stable commit
        uses: actions/checkout@v4
        with:
          ref: dfdd39a57c7fb1ec7e53ab7778a806fdc86f1dff
          fetch-depth: 0

      - name: Verify publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$TARGET_SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "$TAG_NAME already exists; refusing to overwrite an immutable release tag."
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists; refusing duplicate publication."
            exit 1
          fi

          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          test "$(node -p "require('./frontend/package.json').version")" = "1.0.0"
          test "$(node -p "require('./core-release.json').version")" = "1.0.0"
          test "$(node -p "require('./core-release.json').channel")" = "stable"

      - name: Create annotated immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greg44500"
          git config user.email "gregdevweb44500@gmail.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "saas-core-api 1.0.0 stable"
          git push origin "refs/tags/$TAG_NAME"

      - name: Publish stable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "saas-core-api v1.0.0" \
            --notes-file docs/releases/1.0.0.md \
            --verify-tag \
            --latest
