name: Sync Stable Locks

on:
  push:
    branches:
      - release/1.0.0

permissions:
  contents: write

jobs:
  sync-lock-versions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/1.0.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize package and lock versions
        run: |
          npm version 1.0.0 --no-git-tag-version --allow-same-version
          npm --prefix frontend version 1.0.0 --no-git-tag-version --allow-same-version

      - name: Commit lock version synchronization
        run: |
          if git diff --quiet -- package.json package-lock.json frontend/package.json frontend/package-lock.json; then
            echo "No lock version change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "release: synchronize lock versions for 1.0.0"
          git push origin HEAD:release/1.0.0
