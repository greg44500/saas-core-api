name: RC Lockfile Sync

on:
  push:
    branches:
      - release/1.0.0-rc.1
    paths:
      - .github/workflows/rc-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfiles:
    name: Sync RC lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Synchronize lockfile release metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const previousVersion = '0.1.0';
          const nextVersion = '1.0.0-rc.1';
          const lockfiles = ['package-lock.json', 'frontend/package-lock.json'];

          for (const lockfilePath of lockfiles) {
            const lockfile = JSON.parse(readFileSync(lockfilePath, 'utf8'));

            if (lockfile.version !== previousVersion) {
              throw new Error(`${lockfilePath}: version inattendue ${lockfile.version}.`);
            }

            if (lockfile.packages?.['']?.version !== previousVersion) {
              throw new Error(
                `${lockfilePath}: packages[\"\"].version inattendue ${lockfile.packages?.['']?.version}.`,
              );
            }

            lockfile.version = nextVersion;
            lockfile.packages[''].version = nextVersion;

            writeFileSync(
              lockfilePath,
              `${JSON.stringify(lockfile, null, 2)}\n`,
              'utf8',
            );
          }
          NODE

      - name: Verify lockfile diff is strictly limited to four version lines
        shell: bash
        run: |
          git diff --numstat -- package-lock.json frontend/package-lock.json

          changed_files="$(git diff --name-only -- package-lock.json frontend/package-lock.json | wc -l | tr -d ' ')"
          changed_lines="$(git diff --numstat -- package-lock.json frontend/package-lock.json | awk '{add += $1; del += $2} END {print add ":" del}')"

          test "$changed_files" = "2"
          test "$changed_lines" = "4:4"

      - name: Commit synchronized lockfiles and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/rc-lockfile-sync.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json frontend/package-lock.json .github/workflows/rc-lockfile-sync.yml
          git commit -m "release: sync lockfiles for 1.0.0-rc.1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
